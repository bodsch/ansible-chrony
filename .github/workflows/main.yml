---
name: CI

on:
  # workflow_run:
  #   workflows:
  #     - "code linter"
  #   types:
  #     - completed
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
      - '!doc/**'
    # paths:
    #   - 'filter_plugins/*.py'
    #   - '!.github/workflows/*.yml'
    #   - '!doc/**'
    #   - '.config/pycodestyle.cfg'
  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
      - '!doc/**'
    # paths:
    #   - 'filter_plugins/*.py'
    #   - '!.github/workflows/*.yml'
    #   - '!doc/**'
    #   - '.config/pycodestyle.cfg'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: false
        default: 'main'

defaults:
  run:
    working-directory: 'ansible-chrony'

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'

jobs:
  arch:
    name: "${{ matrix.image }} / ansible ${{ matrix.ansible-version }} / python ${{ matrix.python_version }}"
    runs-on: ubuntu-22.04
    # if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - archlinux:latest
          - artixlinux:latest
        ansible-version:
          - '12.3'
        python_version:
          - "3.12"
        scenario:
          - default

    steps:
      - name: check out the codebase.
        uses: actions/checkout@v7.0.1
        with:
          path: 'ansible-chrony'

      - name: 🐍 set up python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "${{ matrix.python_version }}"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-requirements.txt

      - name: force reinstall of community.docker
        run: |
          mkdir -p /home/runner/.ansible/collections
          ansible-galaxy collection install community.docker --force

      - name: test with tox
        run: |
          make \
            test \
            -e TOX_SCENARIO="${{ matrix.scenario }}" \
            -e TOX_ANSIBLE="ansible_${{ matrix.ansible-version }}" \
            -e DISTRIBUTION="${{ matrix.image }}"
